<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner</title>
<script>try{var __t=localStorage.getItem("planner-theme-v1");if(__t==="dark"||__t==="light")document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<meta name="theme-color" content="#F1F3F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1326" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<style>
/* Layout: one column, a day agenda first, bottom tab bar for Day / Week / Month and Add. Navy portal blue with an amber "now" signal. */
:root{
  --bg:#F1F3F9; --surface:#FFFFFF; --surface-2:#E8ECF6; --ink:#141F45; --muted:#586284; --line:#D8DDEC;
  --accent:#2346C6; --accent-ink:#FFFFFF; --now:#D98A00; --now-bg:#FFF2D6; --now-ink:#6B4300; --danger:#B3301F;
  --tint-l:93%; --cink-l:24%; --bar-l:46%;
  --k-task-bg:#E1E8FB; --k-task-ink:#1B3CA8; --k-exam-bg:#FBE4E1; --k-exam-ink:#9C2A1F; --k-event-bg:#DCF0E5; --k-event-ink:#17603A;
  --k-duty-bg:#D6EFF1; --k-duty-ink:#0E5A61; --k-asg-bg:#EBE2FB; --k-asg-ink:#5226A8;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1326; --surface:#151D36; --surface-2:#1D2744; --ink:#E8ECF8; --muted:#9BA6C7; --line:#2A3556;
  --accent:#7D9CFF; --accent-ink:#0D1326; --now:#F2B23C; --now-bg:#3A2D0E; --now-ink:#FFDDA0; --danger:#FF8F82;
  --tint-l:20%; --cink-l:88%; --bar-l:64%;
  --k-task-bg:#243158; --k-task-ink:#AEC0FF; --k-exam-bg:#4A2326; --k-exam-ink:#FFB4AD; --k-event-bg:#1B3D2D; --k-event-ink:#8FDDB1;
  --k-duty-bg:#17393D; --k-duty-ink:#86DCE3; --k-asg-bg:#33264F; --k-asg-ink:#CDB8FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1326; --surface:#151D36; --surface-2:#1D2744; --ink:#E8ECF8; --muted:#9BA6C7; --line:#2A3556;
  --accent:#7D9CFF; --accent-ink:#0D1326; --now:#F2B23C; --now-bg:#3A2D0E; --now-ink:#FFDDA0; --danger:#FF8F82;
  --tint-l:20%; --cink-l:88%; --bar-l:64%;
  --k-task-bg:#243158; --k-task-ink:#AEC0FF; --k-exam-bg:#4A2326; --k-exam-ink:#FFB4AD; --k-event-bg:#1B3D2D; --k-event-ink:#8FDDB1;
  --k-duty-bg:#17393D; --k-duty-ink:#86DCE3; --k-asg-bg:#33264F; --k-asg-ink:#CDB8FF;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 112px}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-weight:500;color:var(--muted);margin-left:8px;font-size:13px}
#sync{font-size:12px;color:var(--muted);text-align:right}

.dayhead,.navrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dh-t{flex:1;min-width:0}
.dh-t h1{font-family:var(--f-display);font-size:clamp(30px,8vw,42px);line-height:1.05;font-weight:750;text-wrap:balance}
.dh-t p{color:var(--muted);font-size:14px;margin-top:2px}
.navlabel{flex:1;text-align:center;font-family:var(--f-display);font-weight:650;font-size:18px}
.ibtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--accent)}

.status{border-radius:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.status .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status h2{font-family:var(--f-display);font-size:19px;line-height:1.2;margin-top:4px;text-wrap:balance}
.status p{color:var(--muted);font-size:14px;margin-top:4px}
.status.now{background:var(--now-bg);border-color:var(--now)}
.status.now .lbl,.status.now p{color:var(--now-ink)}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--now) 25%,transparent);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--now)}

.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;line-height:1.3;padding-top:12px;text-align:right}
.tm b{display:block;font-weight:600;font-size:12px}
.tm span{color:var(--muted)}
.card{border-radius:10px;padding:12px 14px;min-width:0;border:1px solid var(--line);background:var(--surface)}
.course{background:hsl(var(--h) 55% var(--tint-l));color:hsl(var(--h) 45% var(--cink-l));border-color:hsl(var(--h) 50% var(--bar-l) / .35)}
.course .code{font-family:var(--f-mono);font-size:11px;opacity:.8}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.course h3{font-family:var(--f-display);font-size:17px;line-height:1.2;font-weight:650;margin-top:2px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;margin-top:6px;opacity:.85}
.nowtag{background:var(--now);color:#1b1200;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.donetag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.row.past .card{opacity:.62}
.row.now .card{outline:2px solid var(--now);outline-offset:1px}
.gap{list-style:none;margin-left:74px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.gap::before{content:"";flex:none;width:14px;border-top:1px dashed var(--line)}
.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}

.item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;flex:none;margin-top:1px;color:var(--accent-ink)}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk svg{opacity:0}.chk[aria-pressed="true"] svg{opacity:1}
.item-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.ttl{font-weight:600;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--k-task-bg);color:var(--k-task-ink);display:inline-block}
.k-exam{background:var(--k-exam-bg);color:var(--k-exam-ink)}
.k-event{background:var(--k-event-bg);color:var(--k-event-ink)}
.k-weekly{background:var(--k-duty-bg);color:var(--k-duty-ink)}
.c-act{display:flex;align-items:center;gap:6px}
.c-act .pill{padding:3px 10px;font-size:12px}
.k-assignment{background:var(--k-asg-bg);color:var(--k-asg-ink)}
.blk.it.k-assignment{background:var(--k-asg-bg);color:var(--k-asg-ink);border-color:var(--k-asg-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subj{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:hsl(var(--h) 55% var(--tint-l));color:hsl(var(--h) 45% var(--cink-l))}
.due{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.due.late{color:var(--danger);font-weight:600}
.bigadd{width:100%;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:12px;font-weight:700;font-size:15px;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.up{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.up .d{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.up .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.up .t span.x{overflow-wrap:anywhere;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:2px}

.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stats span{font-size:12.5px;font-weight:600;background:var(--surface-2);border-radius:999px;padding:4px 10px}
.hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.wk-in{min-width:680px}
.wk-head,.wk-un,.wk-body{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr))}
.wk-head>div{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.wk-head button{background:none;border:0;width:100%;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.wk-head b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);line-height:1.1}
.wk-head .today b{color:var(--accent)}
.wk-un>div{padding:4px;min-height:6px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line)}
.wk-un .u{font-size:11px;line-height:1.2;padding:2px 5px;border-radius:4px;background:var(--k-task-bg);color:var(--k-task-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-time{position:relative;height:calc(15*var(--hh))}
.wk-time span{position:absolute;right:6px;font-family:var(--f-mono);font-size:10px;color:var(--muted);transform:translateY(-50%)}
.wk-col{position:relative;height:calc(15*var(--hh));border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.wk-col.today{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.blk{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 5px;overflow:hidden;font-size:11px;line-height:1.2;text-align:left;border:1px solid hsl(var(--h) 50% var(--bar-l) / .4);background:hsl(var(--h) 55% var(--tint-l));color:hsl(var(--h) 45% var(--cink-l))}
.blk b{display:block;font-family:var(--f-display);font-size:12px;font-weight:650;line-height:1.15;margin-bottom:2px}
.blk span{display:block;opacity:.85}
.blk.it{border:1px dashed var(--k-task-ink);background:var(--k-task-bg);color:var(--k-task-ink)}
.blk.it.k-exam{background:var(--k-exam-bg);color:var(--k-exam-ink);border-color:var(--k-exam-ink)}
.blk.it.k-event{background:var(--k-event-bg);color:var(--k-event-ink);border-color:var(--k-event-ink)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--now);z-index:2}
.nowline::before{content:"";position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px}
.mhead span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mc{aspect-ratio:1/1.1;max-width:100%;min-width:0;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.mc.blank{background:transparent;border-color:transparent;pointer-events:none}
.mc.today{border-color:var(--accent);color:var(--accent)}
.mc.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 60% var(--bar-l))}
.dots i.sq{border-radius:1px;transform:rotate(45deg);background:var(--now)}
.mc.sel .dots i{box-shadow:0 0 0 1px var(--accent-ink)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 10px}
.panel-h h2{font-family:var(--f-display);font-size:20px}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar>div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;gap:6px}
.tab{background:none;border:0;border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);background:var(--surface-2)}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,28,.55)}
.sheet-card{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet-card h2{font-family:var(--f-display);font-size:22px}
.sheet-card label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.sheet-card input,.sheet-card select,.sheet-card textarea{width:100%;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.actions{display:flex;gap:8px;align-items:center;margin-top:4px}
.sp{flex:1}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:600}
.danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:10px 14px;font-weight:600}
.danger.arm{background:var(--danger);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}

/* top bar, theme button, subjects screen */
.top{align-items:center}
.top-l{min-width:0}
.top-r{display:flex;gap:8px;flex:none}
.top .ibtn{width:38px;height:38px}
#sync{text-align:left;margin-top:1px}
.semcard .actions{margin-top:10px;flex-wrap:wrap}
.filters button.newsem{border-style:dashed;color:var(--accent)}
.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 38px;gap:6px;align-items:center;margin-bottom:6px}
.mrow select,.mrow input{padding:8px 6px!important;font-size:14px!important}
.mrow .ghost{padding:8px 0;text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:hsl(var(--h) 55% 50%);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.chkrow{display:flex;align-items:center;gap:10px}
.chkrow input{width:20px!important;height:20px;flex:none}
.chkrow label{margin:0!important;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important;font-weight:600!important}
textarea.mono{font-family:var(--f-mono);font-size:12px!important;min-height:140px}
.sheet.s2{z-index:45}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="top-l"><div class="brand" id="brand">Planner</div><div id="sync" aria-live="polite"></div></div>
    <div class="top-r"><button class="ibtn" id="themebtn" data-act="theme" aria-label="Switch theme"></button><button class="ibtn" data-act="subjects" aria-label="Subjects and semesters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg></button></div></div>
  <main id="app"></main>
</div>

<nav class="tabbar" aria-label="Views"><div>
  <button class="tab" data-act="tab" data-tab="day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Day</button>
  <button class="tab" data-act="tab" data-tab="week"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>Week</button>
  <button class="tab" data-act="tab" data-tab="month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</button>
  <button class="tab" data-act="tab" data-tab="tasks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/></svg>Tasks</button>
  <button class="add" data-act="add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
</div></nav>

<script>
(function(){
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var D3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var M3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* day: 0 = Sunday ... 6 = Saturday; times in minutes after midnight */
var SEED_COURSES=[
 {code:'3BSC6C-CRIMINOLOGY7',title:'Criminological Research 1 (Research Methods with Applied Statistics)',short:'Criminological Research 1',units:3,room:'SSS PH3-321',day:2,start:420,end:600,inst:'Lomo, Ruen',h:230},
 {code:'3BSC6C-GED192',title:"Rizal's Life and Works",short:"Rizal's Life and Works",units:3,room:'SSS PH1-412',day:2,start:600,end:780,inst:'',h:50},
 {code:'3BSC6C-GED183',title:'Great Books',short:'Great Books',units:3,room:'SSS PH1-405',day:2,start:780,end:960,inst:'',h:150},
 {code:'3BSC6C-CRIMINOLOGY6',title:'Dispute Resolution and Crises/Incident Management',short:'Dispute Resolution',units:3,room:'SSS PH1-407',day:3,start:780,end:960,inst:'Tuguinay, Elena',h:20},
 {code:'3BSC6C-CFLM1',title:'Character Formation, Nationalism and Patriotism',short:'Character Formation',units:3,room:'SSS PH1-402',day:3,start:960,end:1140,inst:'',h:285},
 {code:'3BSC6C-CA3',title:'Therapeutic Modalities',short:'Therapeutic Modalities',units:2,room:'SSS PH1-407',day:4,start:1140,end:1260,inst:'Natural, Anjie C.',h:175},
 {code:'3BSC6C-CDI6N',title:'Fire Protection and Arson Investigation',short:'Fire Protection and Arson',units:3,room:'SSS PH1-408',day:5,start:420,end:600,inst:'Peralta, Arbie N.',h:5},
 {code:'3BSC6C-FORENSIC5',title:'Lie Detection Techniques',short:'Lie Detection',units:3,room:'SSS PH1-404',day:6,start:600,end:780,inst:'Quizon, John Ray D.',h:330},
 {code:'3BSC6C-CDI5N',title:'Technical English 1 (Technical Report Writing and Presentation)',short:'Technical English 1',units:3,room:'SSS PH1-405',day:6,start:960,end:1140,inst:'David, Vanesa D.',h:200}
];
var SEED_DUTIES=[
 {code:'OFFICE DUTY',title:'PARACS Office Duty',short:'PARACS Duty',room:'PARACS Office',day:5,start:600,end:1020,h:185}
];
var HH=40,G0=7,G1=22,LS='planner-items-v1',LSTAB='planner-tab-v1',LSS='planner-sems-v1',LSTH='planner-theme-v1';
var COURSES=[],DUTIES=[],sems=[],activeSem='',semView='';
var HUES=[230,50,150,20,285,175,5,330];

function $(s,r){return (r||document).querySelector(s)}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function sameDay(a,b){return ymd(a)===ymd(b)}
function mondayOf(d){return addDays(sod(d),-((d.getDay()+6)%7))}
function mins(t){if(!t)return null;var p=t.split(':').map(Number);return p[0]*60+p[1]}
function fmt(m){var h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h>=12?'PM':'AM')}
function dur(m){var h=Math.floor(m/60),mm=m%60;var s=(h?h+'h':'')+(h&&mm?' ':'')+(mm?mm+'m':'');return s||'0m'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function kindName(k){return k==='assignment'?'Assignment':k==='exam'?'Exam':k==='event'?'Event':k==='weekly'?'Weekly':'Task'}
function courseByCode(c){var r=COURSES.filter(function(x){return x.code===c})[0];if(r)return r;var f=null;sems.forEach(function(se){se.subjects.forEach(function(u){if(!f&&u.code===c)f=u})});return f}
function dateShort(d){return D3[d.getDay()]+' '+d.getDate()+' '+M3[d.getMonth()]}

var I={
 left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
 right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};

var items=[],mode='local',col=null,syncNote='';
var filt='all',tab='day',viewDate=sod(new Date()),weekStart=mondayOf(viewDate),monthView=new Date(viewDate.getFullYear(),viewDate.getMonth(),1),selDate=viewDate,editing=null,delArmed=false;
try{var t0=localStorage.getItem(LSTAB);if(t0==='day'||t0==='week'||t0==='month'||t0==='tasks')tab=t0}catch(e){}

function loadLocal(){try{var r=null;try{if(window.AndroidBridge)r=AndroidBridge.loadItems()}catch(e){}if(!r)r=localStorage.getItem(LS);items=r?JSON.parse(r):[]}catch(e){items=[]}}
function codesMap(){var m={};sems.forEach(function(se){se.subjects.forEach(function(u){m[u.code]=u.short||u.title})});return m}
function syncBridge(){try{if(window.AndroidBridge)AndroidBridge.save(JSON.stringify({courses:COURSES,duties:DUTIES,items:items,sems:sems,active:activeSem,semName:curSem().name,codes:codesMap()}))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}syncBridge()}

function entriesFor(date){
  var ds=ymd(date),dow=date.getDay(),out=[];
  COURSES.forEach(function(c){if(c.day===dow)out.push({type:'class',c:c,s:c.start,e:c.end})});
  DUTIES.forEach(function(c){if(c.day===dow)out.push({type:'duty',c:c,s:c.start,e:c.end})});
  items.forEach(function(i){
    if(i.kind==='weekly'){
      if(i.day===dow&&i.start&&i.end)out.push({type:'duty',c:{code:'WEEKLY SCHEDULE',title:i.title,short:i.title,room:i.note||'',h:185,id:i.id,user:true},s:mins(i.start),e:mins(i.end)});
      return;
    }
    if(i.date===ds&&i.start&&(i.kind==='exam'||i.kind==='event')){var s=mins(i.start),e=i.end?mins(i.end):s+60;if(e<=s)e=s+60;out.push({type:'item',i:i,s:s,e:e})}
  });
  out.sort(function(a,b){return a.s-b.s||a.e-b.e});
  var untimed=items.filter(function(i){return i.kind!=='weekly'&&i.date===ds&&(!i.start||i.kind==='assignment'||i.kind==='task')});
  return {timed:out,untimed:untimed};
}
function nowMins(){var n=new Date();return n.getHours()*60+n.getMinutes()}

function statusHTML(){
  var today=sod(new Date()),nm=nowMins();
  var cls=entriesFor(today).timed.filter(function(x){return x.type!=='item'});
  var cur=cls.filter(function(x){return nm>=x.s&&nm<x.e})[0];
  if(cur){
    var pct=Math.round((nm-cur.s)/(cur.e-cur.s)*100);
    return '<div class="status now"><div class="lbl">'+(cur.type==='duty'?'On duty now':'In class now')+'</div><h2>'+esc(cur.c.title)+'</h2><p>'+esc(cur.c.room)+' · ends '+fmt(cur.e)+' · '+dur(cur.e-nm)+' left</p><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }
  var nxt=cls.filter(function(x){return x.s>nm})[0];
  if(nxt)return '<div class="status"><div class="lbl">'+(nxt.type==='duty'?'Next: duty':'Next class')+'</div><h2>'+esc(nxt.c.title)+'</h2><p>Starts '+fmt(nxt.s)+' · in '+dur(nxt.s-nm)+' · '+esc(nxt.c.room)+'</p></div>';
  if(cls.length)return '<div class="status"><div class="lbl">Classes</div><h2>Done for today</h2><p>Your schedule for today is finished.</p></div>';
  for(var k=1;k<=7;k++){
    var d=addDays(today,k),l=entriesFor(d).timed.filter(function(x){return x.type!=='item'});
    if(l.length)return '<div class="status"><div class="lbl">Nothing scheduled today</div><h2>Next:'+esc(l[0].c.title)+'</h2><p>'+dateShort(d)+', '+fmt(l[0].s)+' · '+esc(l[0].c.room)+'</p></div>';
  }
  return '<div class="status"><div class="lbl">Classes</div><h2>No classes today</h2></div>';
}

function itemCard(i,showDue){
  var sc=i.subject?courseByCode(i.subject):null;
  return '<div class="card item'+(i.done?' done':'')+'">'
   +'<button class="chk" data-act="toggle" data-id="'+esc(i.id)+'" aria-pressed="'+(i.done?'true':'false')+'" aria-label="Mark done">'+I.check+'</button>'
   +'<button class="item-main" data-act="edit" data-id="'+esc(i.id)+'"><span class="chips"><span class="kind k-'+esc(i.kind)+'">'+kindName(i.kind)+'</span>'+(sc?'<span class="subj" style="--h:'+sc.h+'">'+esc(sc.short)+'</span>':'')+'</span><span class="ttl">'+esc(i.title)+'</span>'+(i.note?'<span class="note">'+esc(i.note)+'</span>':'')+(showDue?dueHTML(i):'')+'</button></div>';
}

function agendaHTML(date){
  var e=entriesFor(date),isT=sameDay(date,new Date()),nm=nowMins(),h='';
  if(!e.timed.length&&!e.untimed.length){
    return '<div class="empty"><b>Nothing scheduled</b>No classes or tasks on this day. Tap Add to plan something.</div>';
  }
  if(e.timed.length){
    h+='<ul class="list">';
    var prevEnd=null;
    e.timed.forEach(function(x){
      if(prevEnd!==null&&x.s-prevEnd>=30)h+='<li class="gap">'+dur(x.s-prevEnd)+' break</li>';
      prevEnd=Math.max(prevEnd||0,x.e);
      var st=isT?(x.e<=nm?'past':(x.s<=nm?'now':'')):'';
      h+='<li class="row '+st+'"><div class="tm"><b>'+fmt(x.s)+'</b><span>'+fmt(x.e)+'</span></div>';
      if(x.type!=='item'){
        var c=x.c,isD=x.type==='duty';
        h+='<div class="card course" style="--h:'+c.h+'"><div class="c-top"><span class="code">'+esc(c.code)+'</span><span class="c-act">'+(st==='now'?'<span class="nowtag">Now</span>':st==='past'?'<span class="donetag">Done</span>':'')+(c.user?'<button class="pill" data-act="edit" data-id="'+esc(c.id)+'">Edit</button>':'')+'</span></div><h3>'+esc(c.title)+'</h3><p class="meta">'+(c.room?'<span>'+esc(c.room)+'</span>':'')+(isD?'<span>'+dur(x.e-x.s)+' shift</span>':'<span>'+(c.inst?esc(c.inst):'Instructor not assigned yet')+'</span><span>'+c.units+' units · '+dur(c.end-c.start)+'</span>')+'</p></div>';
      }else h+=itemCard(x.i);
      h+='</li>';
    });
    h+='</ul>';
  }
  if(e.untimed.length){
    h+='<div class="sec">Tasks and reminders</div><ul class="list">'+e.untimed.map(function(i){return '<li>'+itemCard(i)+'</li>'}).join('')+'</ul>';
  }
  return h;
}

function upRow(i){
  var d=parseYmd(i.date);
  return '<button class="up" data-act="edit" data-id="'+esc(i.id)+'"><span class="d">'+dateShort(d)+'</span><span class="t"><span class="kind k-'+esc(i.kind)+'">'+kindName(i.kind)+'</span><span class="x">'+esc(i.title)+'</span></span></button>';
}

function dayHTML(){
  var today=sod(new Date()),isT=sameDay(viewDate,today),h='';
  h+='<div class="dayhead"><button class="ibtn" data-act="prevday" aria-label="Previous day">'+I.left+'</button>'
   +'<div class="dh-t"><h1>'+DAYS[viewDate.getDay()]+'</h1><p>'+viewDate.getDate()+' '+MONTHS[viewDate.getMonth()]+' '+viewDate.getFullYear()+'</p></div>'
   +(isT?'':'<button class="pill" data-act="gotoday">Today</button>')
   +'<button class="ibtn" data-act="nextday" aria-label="Next day">'+I.right+'</button></div>';
  if(isT)h+=statusHTML();
  h+=agendaHTML(viewDate);
  if(isT){
    var td=ymd(today);
    var over=items.filter(function(i){return i.date&&!i.done&&i.date<td}).sort(function(a,b){return a.date<b.date?-1:1});
    if(over.length)h+='<div class="sec">Overdue</div><div class="list">'+over.map(upRow).join('')+'</div>';
    var lim=ymd(addDays(today,14));
    var up=items.filter(function(i){return !i.done&&i.date>td&&i.date<=lim}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.start||'')<(b.start||'')?-1:1}).slice(0,6);
    if(up.length)h+='<div class="sec">Coming up</div><div class="list">'+up.map(upRow).join('')+'</div>';
  }
  return h;
}

function longestStretch(){
  var best=null;
  for(var d=0;d<7;d++){
    var l=COURSES.filter(function(c){return c.day===d}).sort(function(a,b){return a.start-b.start});
    var i=0;
    while(i<l.length){
      var j=i,s=l[i].start,e=l[i].end;
      while(j+1<l.length&&l[j+1].start===e){j++;e=l[j].end}
      if(!best||e-s>best.e-best.s)best={day:d,s:s,e:e,n:j-i+1};
      i=j+1;
    }
  }
  return best;
}

function weekLabel(){
  var a=weekStart,b=addDays(a,6);
  if(a.getMonth()===b.getMonth())return a.getDate()+' – '+b.getDate()+' '+M3[b.getMonth()]+' '+b.getFullYear();
  return a.getDate()+' '+M3[a.getMonth()]+' – '+b.getDate()+' '+M3[b.getMonth()]+' '+b.getFullYear();
}

function weekHTML(){
  var today=sod(new Date()),days=[],i,h='';
  for(i=0;i<7;i++)days.push(addDays(weekStart,i));
  var units=curSem().subjects.reduce(function(a,u){return a+(Number(u.units)||0)},0);
  var have={};COURSES.forEach(function(c){have[c.day]=1});
  var free=[1,2,3,4,5,6,0].filter(function(d){return !have[d]}).map(function(d){return D3[d]});
  var ls=longestStretch();
  h+='<div class="navrow"><button class="ibtn" data-act="prevweek" aria-label="Previous week">'+I.left+'</button><div class="navlabel">'+weekLabel()+'</div>'
   +(sameDay(weekStart,mondayOf(today))?'':'<button class="pill" data-act="thisweek">This week</button>')
   +'<button class="ibtn" data-act="nextweek" aria-label="Next week">'+I.right+'</button></div>';
  h+='<div class="stats"><span>'+curSem().subjects.length+' subjects</span><span>'+units+' units</span><span>'+(DUTIES.length+items.filter(function(i){return i.kind==='weekly'}).length)+' duty or weekly slots</span><span>'+Object.keys(have).length+' class days</span><span>Free: '+free.join(', ')+'</span></div>';
  if(ls)h+='<p class="hint">Longest day: '+DAYS[ls.day]+', '+fmt(ls.s)+' to '+fmt(ls.e)+', '+ls.n+' subjects back to back.</p>';
  h+='<div class="wk"><div class="wk-in" style="--hh:'+HH+'px">';
  h+='<div class="wk-head"><div></div>'+days.map(function(d){
    return '<button data-act="goday" data-date="'+ymd(d)+'" class="'+(sameDay(d,today)?'today':'')+'">'+D3[d.getDay()]+'<b>'+d.getDate()+'</b></button>';
  }).join('')+'</div>';
  var anyUn=days.some(function(d){return entriesFor(d).untimed.length});
  if(anyUn)h+='<div class="wk-un"><div></div>'+days.map(function(d){
    return '<div>'+entriesFor(d).untimed.map(function(x){return '<span class="u">'+esc(x.title)+'</span>'}).join('')+'</div>';
  }).join('')+'</div>';
  h+='<div class="wk-body"><div class="wk-time">';
  for(i=0;i<=G1-G0;i++)if(i>0&&i<G1-G0)h+='<span style="top:'+(i*HH)+'px">'+((G0+i)%12||12)+((G0+i)>=12?'p':'a')+'</span>';
  h+='</div>';
  var nm=nowMins();
  days.forEach(function(d){
    var e=entriesFor(d),isT=sameDay(d,today);
    h+='<div class="wk-col'+(isT?' today':'')+'">';
    e.timed.forEach(function(x){
      var top=Math.max(0,(x.s-G0*60)*HH/60),ht=Math.max(18,(Math.min(x.e,G1*60)-Math.max(x.s,G0*60))*HH/60-2);
      if(x.type!=='item')h+='<button class="blk" data-act="'+(x.c.user?'edit':'goday')+'" data-id="'+(x.c.user?esc(x.c.id):'')+'" data-date="'+ymd(d)+'" style="--h:'+x.c.h+';top:'+top+'px;height:'+ht+'px"><b>'+esc(x.c.short)+'</b><span>'+fmt(x.s)+'–'+fmt(x.e)+'</span><span>'+esc(x.c.room)+'</span></button>';
      else h+='<button class="blk it k-'+esc(x.i.kind)+'" data-act="edit" data-id="'+esc(x.i.id)+'" style="top:'+top+'px;height:'+ht+'px"><b>'+esc(x.i.title)+'</b><span>'+fmt(x.s)+'</span></button>';
    });
    if(isT&&nm>=G0*60&&nm<=G1*60)h+='<div class="nowline" style="top:'+((nm-G0*60)*HH/60)+'px"></div>';
    h+='</div>';
  });
  h+='</div></div></div>';
  return h;
}

function monthHTML(){
  var today=sod(new Date()),y=monthView.getFullYear(),m=monthView.getMonth();
  var lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),total=Math.ceil((lead+dim)/7)*7,h='',i;
  h+='<div class="navrow"><button class="ibtn" data-act="prevmonth" aria-label="Previous month">'+I.left+'</button><div class="navlabel">'+MONTHS[m]+' '+y+'</div>'
   +((today.getMonth()===m&&today.getFullYear()===y)?'':'<button class="pill" data-act="thismonth">Today</button>')
   +'<button class="ibtn" data-act="nextmonth" aria-label="Next month">'+I.right+'</button></div>';
  h+='<div class="mhead">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<span>'+x+'</span>'}).join('')+'</div><div class="mgrid">';
  for(i=0;i<total;i++){
    var dn=i-lead+1;
    if(dn<1||dn>dim){h+='<div class="mc blank"></div>';continue}
    var d=new Date(y,m,dn),e=entriesFor(d),dots='';
    e.timed.filter(function(x){return x.type!=='item'}).forEach(function(x){dots+='<i style="--h:'+x.c.h+'"></i>'});
    var ic=items.filter(function(it){return it.date===ymd(d)}).length;
    if(ic)dots+='<i class="sq"></i>';
    h+='<button class="mc'+(sameDay(d,today)?' today':'')+(sameDay(d,selDate)?' sel':'')+'" data-act="selday" data-date="'+ymd(d)+'" aria-label="'+DAYS[d.getDay()]+' '+dn+' '+MONTHS[m]+'"><span>'+dn+'</span><span class="dots">'+dots+'</span></button>';
  }

  h+='<div class="panel-h"><h2>'+DAYS[selDate.getDay()]+', '+selDate.getDate()+' '+M3[selDate.getMonth()]+'</h2><button class="pill" data-act="goday" data-date="'+ymd(selDate)+'">Open day</button></div>';

}

function dueHTML(i){
  if(!i.date)return '<span class="due">No due date</span>';
  var d=parseYmd(i.date),diff=Math.round((d-sod(new Date()))/864e5),rel;
  if(diff===0)rel='today';else if(diff===1)rel='tomorrow';else if(diff===-1)rel='1 day late';else if(diff<0)rel=(-diff)+' days late';else rel='in '+diff+' days';
  return '<span class="due'+(diff<0&&!i.done?' late':'')+'">Due '+dateShort(d)+(i.start?' '+fmt(mins(i.start)):'')+' · '+(i.done?'done':rel)+'</span>';
}
function tasksHTML(){
  var now=sod(new Date()),td=ymd(now),wk=ymd(addDays(now,7));
  var list=items.filter(function(i){return i.kind!=='event'&&i.kind!=='weekly'&&(filt==='all'||i.kind===filt)});
  function key(i){return (i.date||'9999-99-99')+(i.start||'')}
  function cmp(a,b){return key(a)<key(b)?-1:key(a)>key(b)?1:0}
  var pend=list.filter(function(i){return !i.done}).sort(cmp),done=list.filter(function(i){return i.done}).sort(function(a,b){return cmp(b,a)});
  var groups=[['Overdue',pend.filter(function(i){return i.date&&i.date<td})],['Due today',pend.filter(function(i){return i.date===td})],['Next 7 days',pend.filter(function(i){return i.date>td&&i.date<=wk})],['Later',pend.filter(function(i){return i.date>wk})],['No due date',pend.filter(function(i){return !i.date})]];
  var late=groups[0][1].length;
  var h='<div class="dayhead"><div class="dh-t"><h1>Assignments and tasks</h1><p>'+pend.length+' pending'+(late?' · '+late+' overdue':'')+'</p></div></div>';
  h+='<button class="bigadd" data-act="addasg">+ Add an assignment or task</button>';
  h+='<div class="filters">'+[['all','All'],['assignment','Assignments'],['task','Tasks']].map(function(f){return '<button data-act="filt" data-f="'+f[0]+'" aria-pressed="'+(filt===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>';
  if(!pend.length&&!done.length)h+='<div class="empty" style="margin-top:14px"><b>Nothing pending</b>Add an assignment with its subject and due date. It will show here and on your calendar.</div>';
  else if(!pend.length)h+='<div class="empty" style="margin-top:14px"><b>All caught up</b>No pending items.</div>';
  groups.forEach(function(g){if(g[1].length)h+='<div class="sec">'+g[0]+' · '+g[1].length+'</div><ul class="list">'+g[1].map(function(i){return '<li>'+itemCard(i,true)+'</li>'}).join('')+'</ul>'});
  if(done.length)h+='<div class="sec">Done · '+done.length+'</div><ul class="list">'+done.slice(0,10).map(function(i){return '<li>'+itemCard(i,true)+'</li>'}).join('')+'</ul>';
  return h;
}

    subjects:(x.subjects||[]).map(function(u){return {id:String(u.id||newId()),code:String(u.code||''),title:String(u.title||''),short:String(u.short||u.title||''),units:Number(u.units)||0,room:String(u.room||''),inst:String(u.inst||''),h:typeof u.h==='number'?u.h:230,
      meetings:(u.meetings||[]).filter(function(m){return m&&typeof m.day==='number'&&typeof m.start==='number'&&typeof m.end==='number'})}}),
    duties:(x.duties||[])};
}
function seedSems(){
  return [{id:'sem-current',name:'3BSC6C',start:'',auto:false,autoDone:false,
    subjects:SEED_COURSES.map(function(c,i){return {id:'seed'+i,code:c.code,title:c.title,short:c.short,units:c.units,room:c.room,inst:c.inst,h:c.h,meetings:[{day:c.day,start:c.start,end:c.end}]}}),

function rebuild(){

function autoSwitch(){

  sems.forEach(function(x){if(x.auto&&!x.autoDone&&x.start&&x.start<=t&&x.id!==activeSem&&(!best||x.start>best.start))best=x});
  sems.forEach(function(x){if(x.auto&&x.start&&x.start<=t)x.autoDone=true});

/* ---------- storage ---------- */
function newId(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var tt;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3000)}
function persist(item){
  if(mode==='db'&&col){var d={title:item.title,kind:item.kind,subject:item.subject||'',date:item.date,start:item.start||'',end:item.end||'',note:item.note||'',day:item.day==null?-1:item.day,done:!!item.done};return col.doc(item.id).set(d)}
  var k=items.findIndex(function(x){return x.id===item.id});if(k>=0)items[k]=item;else items.push(item);saveLocal();render();return Promise.resolve();
}
function removeItem(id){
  if(mode==='db'&&col)return col.doc(id).delete();
  items=items.filter(function(x){return x.id!==id});saveLocal();render();return Promise.resolve();
}
function initStore(){
  loadSems();loadLocal();fillSubjectSelect();applyTheme();render();syncBridge();
  var cl=window.claude;
  if(!cl||!cl.use)return;
  Promise.all([cl.use('db'),cl.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return;
      col=db.collection('data/users/'+id);
      var slow=setTimeout(function(){syncNote='Waiting for your saved items';render()},10000);
      col.onSnapshot(function(snap){
        clearTimeout(slow);
        if(snap.metadata&&snap.metadata.fromCache&&!snap.docs.length)return;
        mode='db';syncNote='';
        items=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,title:x.title||'',kind:x.kind||'task',subject:x.subject||'',date:x.date||'',start:x.start||'',end:x.end||'',note:x.note||'',day:(typeof x.day==='number'&&x.day>=0)?x.day:null,done:!!x.done}});
        render();
      },function(){clearTimeout(slow);mode='local';col=null;syncNote='';loadLocal();render()});
    });
  }).catch(function(){});
}

/* ---------- sheet ---------- */
function openSheet(item,dateStr,kindDef){
  editing=item?item.id:null;delArmed=false;
  $('#sheet-h').textContent=item?'Edit item':'New item';
  $('#f-title').value=item?item.title:'';
  $('#f-kind').value=item?item.kind:(kindDef||'task');
  $('#f-date').value=item?item.date:dateStr;
  $('#f-start').value=item?item.start||'':'';
  $('#f-end').value=item?item.end||'':'';
  $('#f-note').value=item?item.note||'':'';
  $('#f-subject').value=item?item.subject||'':'';
  $('#f-day').value=String(item&&item.day!=null?item.day:5);
  syncForm();
  $('#f-err').hidden=true;
  var del=$('#f-del');del.hidden=!item;del.textContent='Delete';del.classList.remove('arm');
  $('#sheet').hidden=false;
  setTimeout(function(){$('#f-title').focus()},30);
}
function closeSheet(){$('#sheet').hidden=true;editing=null}
function syncForm(){
  var k=$('#f-kind').value,wk=k==='weekly',due=k==='assignment'||k==='task';
  $('#w-date').hidden=wk;$('#w-day').hidden=!wk;
  $('#w-subj').hidden=(k==='event'||wk);
  $('#w-end').hidden=due;
  $('#l-date').textContent=due?'Due date (optional)':'Date';
  $('#l-start').textContent=due?'Due time (optional)':'Starts';
}
$('#f-kind').addEventListener('change',syncForm);
function defaultDate(){return ymd(tab==='month'?selDate:tab==='week'&&!sameDay(weekStart,mondayOf(new Date()))?weekStart:viewDate)}

$('#form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var title=$('#f-title').value.trim(),date=$('#f-date').value,st=$('#f-start').value,en=$('#f-end').value,err=$('#f-err');
  var msg='',kk=$('#f-kind').value,wk=kk==='weekly',due=kk==='assignment'||kk==='task';
  if(due)en='';
  if(!title)msg='Add a title.';else if(wk&&(!st||!en))msg='Add start and end times.';else if(!wk&&!date&&!due)msg='Pick a date.';else if(!wk&&!date&&st)msg='Add a date for the time.';else if(!wk&&en&&!st)msg='Add a start time, or clear the end time.';else if(st&&en&&mins(en)<=mins(st))msg='End time must be after the start time.';
  if(msg){err.textContent=msg;err.hidden=false;return}
  var prev=editing?items.filter(function(x){return x.id===editing})[0]:null;
  var item={id:editing||newId(),title:title,kind:kk,subject:(kk==='event'||wk)?'':$('#f-subject').value,date:wk?'':date,start:st,end:en,note:$('#f-note').value.trim(),day:wk?Number($('#f-day').value):null,done:prev?!!prev.done:false};
  closeSheet();
  Promise.resolve(persist(item)).catch(function(){toast('Could not save. Check your connection and try again.')});
  if(!wk&&date&&tab!=='tasks'){viewDate=parseYmd(date);if(tab==='month'){selDate=viewDate;monthView=new Date(viewDate.getFullYear(),viewDate.getMonth(),1)}}
});
$('#f-del').addEventListener('click',function(){
  var b=$('#f-del');
  if(!delArmed){delArmed=true;b.textContent='Tap again to delete';b.classList.add('arm');return}
  var id=editing;closeSheet();
  Promise.resolve(removeItem(id)).catch(function(){toast('Could not delete. Try again.')});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- actions ---------- */
function setTab(t){tab=t;try{localStorage.setItem(LSTAB,t)}catch(e){}}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),ds=el.getAttribute('data-date');
  if(a==='theme'){toggleTheme();return}
  else if(a==='subjects'){semView=activeSem;tab='subjects'}
  else if(a==='back'){setTab('day')}
  else if(a==='semview'){semView=id}
  else if(a==='usesem'){useSem();return}
  else if(a==='editsem'){openSem(semView);return}
  else if(a==='newsem'){openSem(null);return}
  else if(a==='addsubj'){openSubj(null);return}
  else if(a==='editsubj'){openSubj(id);return}
  else if(a==='closes'){closeS();return}
  else if(a==='closem'){closeM();return}
  else if(a==='closeb'){$('#bsheet').hidden=true;return}
  else if(a==='backup'){openBackup();return}
  else if(a==='bcopy'){doCopy();return}
  else if(a==='brestore'){doRestore();return}
  else if(a==='hue'){sHue=Number(el.getAttribute('data-h'));readMeets();renderHues();return}
  else if(a==='madd'){readMeets();sMeets.push({day:1,start:null,end:null});renderMeets();return}
  else if(a==='mdel'){readMeets();sMeets.splice(Number(el.getAttribute('data-i')),1);renderMeets();return}
  else if(a==='tab'){setTab(el.getAttribute('data-tab'))}
  else if(a==='add'){openSheet(null,tab==='tasks'?'':defaultDate(),tab==='tasks'?'assignment':'task');return}
  else if(a==='addasg'){openSheet(null,'','assignment');return}
  else if(a==='filt')filt=el.getAttribute('data-f');
  else if(a==='closesheet'){closeSheet();return}
  else if(a==='prevday')viewDate=addDays(viewDate,-1);
  else if(a==='nextday')viewDate=addDays(viewDate,1);
  else if(a==='gotoday')viewDate=sod(new Date());
  else if(a==='goday'){viewDate=parseYmd(ds);setTab('day')}
  else if(a==='prevweek')weekStart=addDays(weekStart,-7);
  else if(a==='nextweek')weekStart=addDays(weekStart,7);
  else if(a==='thisweek')weekStart=mondayOf(new Date());
  else if(a==='prevmonth')monthView=new Date(monthView.getFullYear(),monthView.getMonth()-1,1);
  else if(a==='nextmonth')monthView=new Date(monthView.getFullYear(),monthView.getMonth()+1,1);
  else if(a==='thismonth'){var n=sod(new Date());monthView=new Date(n.getFullYear(),n.getMonth(),1);selDate=n}
  else if(a==='selday')selDate=parseYmd(ds);
  else if(a==='edit'){var it=items.filter(function(x){return x.id===id})[0];if(it)openSheet(it,it.date);return}
  else if(a==='toggle'){
    var t=items.filter(function(x){return x.id===id})[0];if(!t)return;
    var nx={};Object.keys(t).forEach(function(k){nx[k]=t[k]});nx.done=!t.done;
    Promise.resolve(persist(nx)).catch(function(){toast('Could not save. Try again.')});
    return;
  }
  render();
});

setInterval(function(){if(!document.hidden&&$('#sheet').hidden&&(tab==='day'||tab==='week'))render()},30000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(themePref==='auto')applyTheme();
  var b=autoSwitch();if(b){rebuild();fillSubjectSelect();saveSems();toast('Switched to '+b.name)}
  if($('#sheet').hidden&&$('#ssheet').hidden&&$('#msheet').hidden&&$('#bsheet').hidden)render();
});
initStore();
})();
</script>
